<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUT Championship | PHOTO</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&display=swap" rel="stylesheet"><style>
/* Footer — match the homepage MUT metallic logo dimensions */
footer .footer-logo{display:flex;justify-content:center;align-items:center;margin:0 auto 12px;}
footer .footer-logo img{display:block;width:clamp(100px,16vw,180px);max-width:100%;height:auto;object-fit:contain;}
/* MUT PHOTO — event-linked list */
.mut-photo-wrap{max-width:1480px;margin:auto}
#photo{padding:90px clamp(14px,3vw,44px);background:#050505;color:#fff}
.mut-photo-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}
.mut-photo-heading h2{display:flex;align-items:center;gap:17px;font:400 clamp(29px,3.2vw,42px) "Bebas Neue",Arial,sans-serif;letter-spacing:.09em;margin:0}
.mut-photo-heading h2:before{content:"";width:10px;height:38px;background:#e50920;transform:skewX(-23deg)}
.mut-photo-all{color:#fff;text-decoration:none;font-size:16px;font-weight:700;white-space:nowrap}
.mut-photo-all span{color:#e50920;font-size:24px;margin-left:5px}
.mut-photo-list{border:1px solid #565656;background:#0b0b0b;border-radius:17px;padding:12px 27px}
.mut-photo-row{display:flex;align-items:center;gap:20px;justify-content:space-between;padding:20px 5px;border-bottom:1px solid #343434;min-height:80px}
.mut-photo-row:last-child{border-bottom:0}
.mut-photo-info{min-width:0}.mut-photo-name{font-size:18px;font-weight:800;overflow-wrap:anywhere}.mut-photo-date{font-size:13px;color:#999;margin-top:7px}
.mut-photo-button{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:116px;min-height:43px;padding:10px 16px;border-radius:5px;background:#c20d24;border:1px solid #e33b4c;color:#fff;text-decoration:none;font-size:14px;font-weight:800;transition:.2s}
.mut-photo-button:hover{background:#ed1934}.mut-photo-button.is-pending{background:#262626;border-color:#444;color:#aaa;cursor:default}
.mut-photo-state{padding:35px 10px;text-align:center;color:#aaa}
@media(max-width:700px){#photo{padding:60px 16px}.mut-photo-heading h2{font-size:29px;gap:10px}.mut-photo-heading h2:before{width:7px;height:28px}.mut-photo-all{font-size:13px}.mut-photo-list{padding:6px 14px}.mut-photo-row{gap:10px;padding:17px 0}.mut-photo-name{font-size:13px}.mut-photo-date{font-size:11px}.mut-photo-button{min-width:86px;min-height:37px;padding:8px;font-size:12px}}
body{margin:0;background:#050505;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}main{min-height:75vh}#photo{padding-top:150px}.desktop-nav a.active{color:#e50920}@media(max-width:700px){#photo{padding-top:120px}}</style></head><body><header class="site-header">

</div><main><section id="photo" aria-labelledby="mut-photo-title"><div class="mut-photo-wrap"><div class="mut-photo-heading"><h2 id="mut-photo-title">PHOTO</h2></div><div id="mutPhotoList" class="mut-photo-list"><div class="mut-photo-state">대회 사진 목록을 불러오는 중입니다.</div></div></div></section></main><footer>

</footer><script src="script.js"></script><script>
/* PHOTO: server events are the sole source; no separate albums or posters */
function mutPhotoEscape(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function mutPhotoLink(value){try{const url=new URL(String(value||""));return url.protocol==="https:" && (url.hostname==="drive.google.com"||url.hostname==="docs.google.com")?url.href:"";}catch{return "";}}
function mutPhotoRows(events,limit){return events.slice().sort((a,b)=>String(b.event_date||"").localeCompare(String(a.event_date||""))||Number(b.id)-Number(a.id)).slice(0,limit).map(event=>{const url=mutPhotoLink(event.photo_url);return `<div class="mut-photo-row"><div class="mut-photo-info"><div class="mut-photo-name">${mutPhotoEscape(event.name||"MUT CHAMPIONSHIP")}</div><div class="mut-photo-date">${mutPhotoEscape(String(event.event_date||"").replace(/-/g,"."))}</div></div>${url?`<a class="mut-photo-button" href="${mutPhotoEscape(url)}" target="_blank" rel="noopener noreferrer" aria-label="${mutPhotoEscape(event.name)} 사진 보기">PHOTO ↗</a>`:'<span class="mut-photo-button is-pending" aria-disabled="true">준비중</span>'}</div>`;}).join("");}
async function mutLoadPhotoList(){const target=document.getElementById("mutPhotoList");if(!target)return;try{const response=await fetch("/api/events",{cache:"no-store"});if(!response.ok)throw new Error("대회 조회 실패");const data=await response.json();if(!data.ok||!Array.isArray(data.events))throw new Error("대회 데이터 오류");target.innerHTML=data.events.length?mutPhotoRows(data.events,target.dataset.limit?Number(target.dataset.limit):999999):'<div class="mut-photo-state">등록된 대회가 없습니다.</div>';}catch(e){console.error("PHOTO 목록 오류",e);target.innerHTML='<div class="mut-photo-state">대회 사진 목록을 불러오지 못했습니다.</div>';}}
document.addEventListener("DOMContentLoaded",mutLoadPhotoList);
</script></body></html>
