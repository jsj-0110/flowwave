</div><main class="wrap"><h1 class="heading">NOTICE</h1><div class="tools"><span id="total" class="muted">TOTAL 0</span><input id="search" class="search" type="search" placeholder="제목 또는 내용 검색" aria-label="공지사항 검색"></div><div class="panel"><table class="table"><thead><tr><th>번호</th><th>구분</th><th>제목</th><th>작성일</th></tr></thead><tbody id="rows"></tbody></table><div class="cards" id="cards"></div></div><div class="pagination" id="pagination"></div></main><script>
let notices=[],page=1;const perPage=10;
const fmt=n=>String(n.created_at||'').slice(0,10).replace(/-/g,'.');
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const filtered=notices.filter(n=>(String(n.title||'')+' '+String(n.content||'')).toLowerCase().includes(q));const pages=Math.max(1,Math.ceil(filtered.length/perPage));page=Math.min(page,pages);const view=filtered.slice((page-1)*perPage,page*perPage);document.getElementById('total').textContent='TOTAL '+filtered.length;const rows=document.getElementById('rows'),cards=document.getElementById('cards'),nav=document.getElementById('pagination');rows.replaceChildren();cards.replaceChildren();nav.replaceChildren();if(!view.length){rows.innerHTML='<tr><td colspan="4" class="empty">등록된 공지사항이 없습니다.</td></tr>';cards.innerHTML='<div class="empty">등록된 공지사항이 없습니다.</div>'}view.forEach((n,i)=>{const href='notice-detail.html?id='+encodeURIComponent(n.id),important=!!Number(n.important);const tr=document.createElement('tr');for(const [val,cls] of [[important?'—':String((page-1)*perPage+i+1),''],[important?'중요':'일반',''],[n.title||'-','title'],[fmt(n),'']]){const td=document.createElement('td');td.className=cls;if(cls==='title'){const a=document.createElement('a');a.href=href;a.textContent=val;td.append(a)}else if(val==='중요'){const s=document.createElement('span');s.className='important';s.textContent=val;td.append(s)}else td.textContent=val;tr.append(td)}rows.append(tr);const c=document.createElement('div');c.className='card';if(important){const b=document.createElement('span');b.className='important';b.textContent='중요';c.append(b)}const a=document.createElement('a');a.className='card-title';a.href=href;a.textContent=n.title||'-';const d=document.createElement('div');d.className='meta';d.textContent=fmt(n);c.append(a,d);cards.append(c)});if(pages>1)for(let p=1;p<=pages;p++){const b=document.createElement('button');b.textContent=p;b.className=p===page?'active':'';b.onclick=()=>{page=p;render();window.scrollTo({top:0,behavior:'smooth'})};nav.append(b)}}
document.getElementById('search').addEventListener('input',()=>{page=1;render()});fetch('/api/notices',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{notices=(d.notices||[]).sort((a,b)=>Number(b.important||0)-Number(a.important||0)||String(b.created_at||'').localeCompare(String(a.created_at||''))||Number(b.id)-Number(a.id));render()}).catch(()=>{document.getElementById('rows').innerHTML='<tr><td colspan="4" class="empty">공지사항을 불러오지 못했습니다.</td></tr>';document.getElementById('cards').innerHTML='<div class="empty">공지사항을 불러오지 못했습니다.</div>'});
</script><footer><img src="images/MUT_metallic_logo.png" alt="MUT Championship"></footer>
<script>
/* NOTICE-only mobile navigation: no changes to notice API or PC menus. */
(function(){
  const button=document.querySelector('.notice-mobile-header .menu-button');
  const menu=document.getElementById('mut-mobile-menu');
  if(!button||!menu)return;
  const close=()=>{
    menu.classList.remove('open');
    button.setAttribute('aria-expanded','false');
    button.setAttribute('aria-label','메뉴 열기');
  };
  button.addEventListener('click',()=>{
    const open=!menu.classList.contains('open');
    menu.classList.toggle('open',open);
    button.setAttribute('aria-expanded',String(open));
    button.setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기');
  });
  menu.querySelectorAll('a').forEach(link=>link.addEventListener('click',close));
  document.addEventListener('keydown',event=>{if(event.key==='Escape')close();});
  window.addEventListener('resize',()=>{if(window.innerWidth>850)close();});
})();
</script>
